<!doctype html>
<!--
PROTOTYPE (throwaway), ticket "Graph view interaction and visual direction".
Question: how should the graph view look and behave in long exploration sessions?
Three structurally different variants, switch with ← / → or the bar at the bottom:
  A Canvas      Sigma.js + graphology, full-bleed graph, Clusters as washes, floating detail panel
  B Margin pane force-graph, graph beside a docked reading pane (Cluster index when nothing is selected)
  C Trail       Connection-first: typeset passages you follow Book to Book, graph demoted to a minimap
All data is SAMPLE: real, well-known Books with invented Connections and invented reader Notes.
"Finish Stoner" in the bar simulates the arrival from marking a Book read.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marginalia graph prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@2.4.0/build/sigma.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.43.5/dist/force-graph.min.js"></script>
<style>
:root{
  --paper:#f3ecdd; --paper-2:#faf5ea; --paper-3:#e9e0cd;
  --ink:#231d17; --ink-2:#5d5245; --ink-3:#6f6454; --rule:#d8cdb7;
  --thematic:#3e5f8a; --contrast:#a8432f; --context:#6f7a3a;
  --serif:'Newsreader',Georgia,serif; --sans:'Hanken Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.5}
::selection{background:#e6c98a;color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--thematic);outline-offset:2px}
#stage,.variant{position:absolute;inset:0;overflow:hidden}
.sample{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;font:500 11px var(--sans);letter-spacing:.04em;color:var(--ink-3);background:var(--paper-2);border:1px solid var(--rule);padding:3px 10px;border-radius:99px;white-space:nowrap}

/* prototype bar */
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);border-radius:99px;padding:6px 8px;box-shadow:0 6px 20px rgba(35,29,23,.3);font:500 13px var(--sans)}
.bar button{padding:6px 12px;border-radius:99px}
.bar button:hover{background:rgba(255,255,255,.14)}
.bar .sep{width:1px;height:18px;background:rgba(255,255,255,.25)}
.bar .vl{min-width:150px;text-align:center}
.bar button:disabled{opacity:.4;cursor:default}

.brand{font:italic 500 22px var(--serif);letter-spacing:.01em}
.tag{display:inline-flex;align-items:center;gap:8px;font:500 12px var(--sans);letter-spacing:.02em;text-transform:none}
.tag i{display:inline-block;width:22px;border-radius:2px}
.tag.thematic{color:var(--thematic)} .tag.contrast{color:var(--contrast)} .tag.context{color:var(--context)}
.tag.thematic i{background:var(--thematic)} .tag.contrast i{background:var(--contrast)} .tag.context i{background:var(--context)}
q{quotes:none;font-style:italic;text-decoration:underline;text-decoration-color:#c9a45a;text-decoration-thickness:1px;text-underline-offset:3px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.fresh{font:500 13px var(--sans);color:var(--contrast);margin:0 0 10px}

/* ---------- A: canvas ---------- */
.a-stage{position:absolute;inset:0}
.a-stage canvas.wash{position:absolute;inset:0;width:100%;height:100%}
.a-stage .sg{position:absolute;inset:0}
.a-brand{position:absolute;top:20px;left:28px}
.a-legend{position:absolute;left:28px;bottom:26px;display:flex;flex-direction:column;gap:4px;font:400 12px var(--sans);color:var(--ink-2)}
.a-legend .row{display:flex;gap:16px}
.a-legend .note{color:var(--ink-3);margin-top:2px}
.a-panel{position:absolute;top:24px;right:24px;bottom:84px;width:390px;background:var(--paper-2);border:1px solid var(--rule);border-radius:10px;box-shadow:0 10px 30px rgba(35,29,23,.12),0 2px 6px rgba(35,29,23,.06);padding:26px 26px 12px;overflow:auto}
.a-panel[hidden]{display:none}
.a-panel h2{font:500 30px/1.12 var(--serif);margin:0 0 6px;text-wrap:balance}
.by{font:400 14px var(--sans);color:var(--ink-2);margin:0 0 20px}
.conns{list-style:none;margin:0;padding:0}
.conn{padding:14px 0;border-top:1px solid var(--rule)}
.conn.on{background:linear-gradient(90deg,#f0e4c6,#f0e4c600);margin:0 -26px;padding:14px 26px}
.conn .go{display:block;font:italic 500 19px/1.25 var(--serif);margin:6px 0 4px;text-align:left}
.conn .go:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.conn p{margin:0;font-size:15.5px;color:#3a322a}
.clabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.clabel{position:absolute;left:0;top:0;pointer-events:auto;white-space:nowrap;font:italic 500 24px var(--serif);color:rgba(35,29,23,.4);padding:2px 6px;border-radius:6px}
.clabel:hover,.clabel.on{color:var(--ink);background:rgba(250,245,234,.7)}
.a-panel .trail{margin:0 0 18px;font-size:12.5px}
.a-panel .cdesc{font-size:16.5px;margin:0 0 18px;color:#33291f}
.a-panel .follow{font:500 13px var(--sans);color:var(--ink-2);border-bottom:1px solid var(--rule);margin-top:8px}
.a-panel .follow:hover{color:var(--ink)}
.clink:hover{text-decoration:underline;text-underline-offset:3px}
.x{position:absolute;top:14px;right:16px;font:500 13px var(--sans);color:var(--ink-3)}

/* ---------- B: margin pane ---------- */
.b-wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 440px}
.b-graph{position:relative;min-width:0}
.b-graph .brand{position:absolute;top:20px;left:28px;z-index:2}
.b-graph .hint{position:absolute;left:28px;bottom:26px;font:400 12px var(--sans);color:var(--ink-3);display:flex;gap:16px}
.b-pane{background:var(--paper-2);border-left:1px solid var(--rule);overflow:auto;padding:56px 40px 100px 64px;position:relative}
.b-pane:before{content:"";position:absolute;left:46px;top:0;bottom:0;width:1px;background:#e3b5a8}
.b-pane h2{font:500 34px/1.1 var(--serif);margin:0 0 6px;text-wrap:balance}
.b-pane h3{font:500 13px var(--sans);color:var(--ink-3);margin:36px 0 10px;letter-spacing:.02em}
.b-pane .cl{display:block;text-align:left;padding:10px 0;border-top:1px solid var(--rule);width:100%}
.b-pane .cl b{font:italic 500 19px var(--serif);display:block}
.b-pane .cl span{font:400 13px var(--sans);color:var(--ink-2)}
.b-pane .cl:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.mn{position:relative;padding:14px 0 18px;border-top:1px solid var(--rule)}
.mn.on{background:linear-gradient(90deg,#f0e4c6,#f0e4c600);margin-left:-18px;padding-left:18px}
.mn .go{font:italic 500 20px/1.25 var(--serif);display:block;text-align:left;margin:6px 0 5px}
.mn .go:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.mn p{margin:0;font-size:16px;color:#3a322a}
.b-pane .lead{font-size:16px;color:var(--ink-2);margin:0}

/* ---------- C: trail ---------- */
.c-wrap{position:absolute;inset:0;display:grid;grid-template-columns:1fr 360px}
.c-main{overflow:auto;padding:28px 56px 120px}
.c-main .inner{max-width:680px;margin:0 auto}
.trail{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;font:400 13px var(--sans);color:var(--ink-3);margin:18px 0 56px}
.trail button{color:var(--ink-2);border-bottom:1px solid var(--rule)}
.trail button:hover{color:var(--ink)}
.trail .cur{color:var(--ink);font-weight:600}
.c-main h1{font:500 clamp(38px,5vw,60px)/1.04 var(--serif);margin:0 0 10px;text-wrap:balance;letter-spacing:-.01em}
.c-main .by{margin-bottom:46px}
.pass{padding:26px 0 30px;border-top:1px solid var(--rule)}
.pass .cross{font:italic 400 14px var(--serif);color:var(--ink-3);margin-left:10px}
.pass .go{display:block;font:italic 500 28px/1.2 var(--serif);margin:10px 0 8px;text-align:left}
.pass .go:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px}
.pass p{margin:0 0 12px;font-size:19px;line-height:1.55;color:#33291f}
.pass .follow{font:500 13px var(--sans);color:var(--ink-2);border-bottom:1px solid var(--rule)}
.pass .follow:hover{color:var(--ink)}
.c-mini{border-left:1px solid var(--rule);background:var(--paper-2);position:relative}
.c-mini .cap{position:absolute;left:20px;top:20px;font:400 12px var(--sans);color:var(--ink-3);z-index:2}
.c-mini .fg{position:absolute;inset:0}
.idx h3{font:italic 500 22px var(--serif);margin:30px 0 8px}
.idx button{display:block;font:500 19px/1.7 var(--serif);text-align:left}
.idx button:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.idx .by2{font:400 13px var(--sans);color:var(--ink-3);margin-left:8px}

@media (max-width:900px){
  .a-panel{left:12px;right:12px;width:auto;top:auto;height:50%;bottom:76px}
  .b-wrap,.c-wrap{grid-template-columns:1fr;grid-template-rows:45% 55%}
  .c-main{order:2;padding:20px 22px 120px}.c-mini{order:1;border-left:0;border-bottom:1px solid var(--rule)}
  .b-pane{padding:30px 22px 100px 34px}.b-pane:before{left:18px}
  .sample{display:none}
}
</style>
</head>
<body>
<div class="sample">PROTOTYPE · sample data: real Books, invented Connections and Notes</div>
<div id="stage"></div>
<div class="bar" id="bar">
  <button id="prev" aria-label="Previous variant">‹</button>
  <span class="vl" id="vl"></span>
  <button id="next" aria-label="Next variant">›</button>
  <span class="sep"></span>
  <button id="finish">Finish “Stoner”</button>
  <button id="reset">Reset</button>
</div>

<script>
/* =============== sample data =============== */
const CLUSTERS=["The cost of a quiet life","Systems that press on people","Living with absurdity","How we come to know","Human history, long view"];
const books=[
 ["rotd","The Remains of the Day","Kazuo Ishiguro","1989",0,"Remains of the Day"],
 ["rr","Revolutionary Road","Richard Yates","1961",0],
 ["dall","Mrs Dalloway","Virginia Woolf","1925",0],
 ["stoner","Stoner","John Williams","1965",0],
 ["nlmg","Never Let Me Go","Kazuo Ishiguro","2005",0],
 ["bel","Beloved","Toni Morrison","1987",0],
 ["n84","Nineteen Eighty-Four","George Orwell","1949",1],
 ["bnw","Brave New World","Aldous Huxley","1932",1],
 ["orig","The Origins of Totalitarianism","Hannah Arendt","1951",1,"Origins of Totalitarianism"],
 ["eich","Eichmann in Jerusalem","Hannah Arendt","1963",1],
 ["seeing","Seeing Like a State","James C. Scott","1998",1],
 ["hod","Heart of Darkness","Joseph Conrad","1899",1],
 ["trial","The Trial","Franz Kafka","1925",1],
 ["med","Meditations","Marcus Aurelius","c. 180",2],
 ["sen","Letters from a Stoic","Seneca","c. 65",2],
 ["frankl","Man's Search for Meaning","Viktor Frankl","1946",2],
 ["sis","The Myth of Sisyphus","Albert Camus","1942",2],
 ["stranger","The Stranger","Albert Camus","1942",2],
 ["kahn","Thinking, Fast and Slow","Daniel Kahneman","2011",3],
 ["kuhn","The Structure of Scientific Revolutions","Thomas Kuhn","1962",3,"Scientific Revolutions"],
 ["geb","Gödel, Escher, Bach","Douglas Hofstadter","1979",3],
 ["gene","The Selfish Gene","Richard Dawkins","1976",3],
 ["sap","Sapiens","Yuval Noah Harari","2011",4],
 ["guns","Guns, Germs, and Steel","Jared Diamond","1997",4],
 ["spring","Silent Spring","Rachel Carson","1962",4],
 ["braid","Braiding Sweetgrass","Robin Wall Kimmerer","2013",4],
].map(([id,t,a,y,c,l])=>({id,t,a,y,c,l:l||t}));
const B=Object.fromEntries(books.map(b=>[b.id,b]));
const edges=[
 ["stoner","rotd","thematic","strong","Both follow a man who gives his life to duty and sees the cost too late. Your note on Stoner, “he never once says what he wanted,” sits beside your note on Stevens: “the dignity is the tragedy.”"],
 ["stoner","rr","contrast","strong","Stoner accepts a small life without complaint; Frank and April Wheeler burn theirs down trying to escape one. Same suburbs of the soul, opposite answers."],
 ["stoner","sis","thematic","moderate","Persisting at an unglamorous task: Stoner at his lectern, Sisyphus at his stone. Your note: “the work is the whole argument.”"],
 ["rotd","dall","context","moderate","Both hold a single day's interior under social manners, one told through service, the other through hosting."],
 ["rotd","nlmg","thematic","strong","Ishiguro's narrator trap again: a person who cannot see what was denied them. Your note: “Kathy never asks why.”"],
 ["bel","nlmg","thematic","moderate","Both ask what a life is worth to the people who claim to own it."],
 ["dall","rr","contrast","moderate","Clarissa makes peace with an ordinary life; April cannot. Two verdicts on the same domestic bargain."],
 ["bel","dall","context","moderate","Sethe and Septimus: the aftermath of slavery and of war, living on in the present tense."],
 ["n84","bnw","contrast","strong","Two answers to what control looks like: pain versus pleasure. Your note: “Huxley is the one that frightens me.”"],
 ["n84","orig","context","strong","Arendt gives the historical machinery that Orwell compresses into fiction."],
 ["orig","eich","thematic","strong","The same question seen twice, once as system and once as a single clerk: how ordinary people carry out the unthinkable."],
 ["eich","trial","thematic","moderate","Guilt that never finds a face. Your note: “Josef K. and Eichmann both hide in procedure.”"],
 ["trial","n84","thematic","moderate","A state whose power is that you cannot learn the rules that judge you."],
 ["seeing","orig","contrast","moderate","Scott blames well-meaning planning; Arendt blames ideology and terror. Disaster without villains versus disaster with them."],
 ["hod","orig","context","moderate","Arendt traces totalitarian method back to imperial administration; Conrad is that world in fiction."],
 ["bnw","seeing","thematic","moderate","Both distrust order that makes people legible so they can be managed."],
 ["med","sen","thematic","strong","Two Stoics, one emperor and one adviser, repeating the same discipline of attention."],
 ["med","frankl","thematic","strong","Freedom lives in the response, not the event. Your note: “Frankl is Marcus with the stakes raised.”"],
 ["frankl","sis","contrast","strong","Frankl finds meaning to endure; Camus refuses to supply it and insists on revolt anyway."],
 ["sis","stranger","thematic","strong","The philosophy and the character: Meursault is the absurd man Camus describes."],
 ["stranger","trial","thematic","moderate","Judged by a system for who they are rather than what they did."],
 ["med","rotd","contrast","moderate","Stevens practises duty as a Stoic would; the novel asks what it costs to practise it for the wrong master."],
 ["kahn","kuhn","thematic","moderate","Both are about frames that make you blind to what does not fit."],
 ["kuhn","geb","context","moderate","Paradigms and formal systems: both ask what lies outside the rules you are playing by."],
 ["geb","gene","thematic","moderate","Meaning emerging from simple replicating rules, in mind and in life."],
 ["kahn","gene","contrast","moderate","Rational agent versus evolved heuristic: two stories about why people choose badly."],
 ["kahn","seeing","thematic","moderate","Confident experts and the planning fallacy: why the schemes Scott describes felt so convincing."],
 ["sap","guns","contrast","strong","Harari says shared stories drove history; Diamond says geography did. Your note: “read them as an argument.”"],
 ["guns","spring","context","moderate","Diamond's ecological stage and Carson's warning about what we do to it."],
 ["sap","gene","context","moderate","Dawkins supplies the biology Harari builds the story on."],
 ["spring","braid","contrast","strong","Carson warns in the language of science; Kimmerer answers in the language of reciprocity."],
 ["braid","seeing","thematic","moderate","Local, embodied knowledge against the view from above that Scott calls legibility."],
 ["guns","seeing","context","moderate","Both explain why some societies end up with states that can reshape the land."],
].map(([a,b,type,s,e],i)=>({a,b,type,s,e,i}));
const TYPE={thematic:{c:"#3e5f8a",n:"Thematic"},contrast:{c:"#a8432f",n:"Contrast"},context:{c:"#6f7a3a",n:"Context"}};
const WASH=["#c9a08f","#a9b6c9","#b9c19a","#dcc08a","#c3a6bb"];
const INK="#231d17",FADE="#d9cfbb",PAPER="#f3ecdd";
const TOP_N=3; // prototype constant: each Book's strongest ~N Connections show; select a Book to reveal the rest

/* =============== state =============== */
const S={cluster:null,selected:null,selEdge:null,arrived:false,fresh:false,revealed:new Set(),trail:[],hover:null};
let timers=[];
const srank=e=>e.s==="strong"?0:1;
const cmp=(x,y)=>srank(edges[x])-srank(edges[y])||x-y;
const present=id=>id!=="stoner"||S.arrived;
const live=i=>{const e=edges[i];if(!present(e.a)||!present(e.b))return false;return (e.a==="stoner"||e.b==="stoner")?S.revealed.has(i):true};
function neighbors(id){return edges.map((_,i)=>i).filter(i=>live(i)&&(edges[i].a===id||edges[i].b===id)).sort(cmp).map(i=>({i,o:edges[i].a===id?edges[i].b:edges[i].a}))}
let memo={k:"",set:null};
function shown(){
  const k=[S.arrived,S.revealed.size,S.selected,S.cluster].join("|");if(memo.k===k)return memo.set;
  const set=new Set(),by={};
  edges.forEach((e,i)=>{if(!live(i))return;(by[e.a]??=[]).push(i);(by[e.b]??=[]).push(i);if(e.a===S.selected||e.b===S.selected)set.add(i);if(S.cluster!=null&&B[e.a].c===S.cluster&&B[e.b].c===S.cluster)set.add(i)});
  Object.values(by).forEach(l=>l.sort(cmp).slice(0,TOP_N).forEach(i=>set.add(i)));
  memo={k,set};return set;
}
const deg=id=>edges.filter(e=>e.a===id||e.b===id).length;
const nodeSize=id=>4.5+deg(id)*1.1;
const fmt=t=>t.replace(/“([^”]+)”/g,"<q>$1</q>");
const clusterMembers=c=>books.filter(b=>b.c===c&&present(b.id));
function trailEdges(){const s=new Set();for(let k=1;k<S.trail.length;k++){const x=S.trail[k-1],y=S.trail[k];edges.forEach(e=>{if((e.a===x&&e.b===y)||(e.a===y&&e.b===x))s.add(e.i)})}return s}
function focusSet(){
  if(S.selected){const s=new Set([S.selected,...S.trail]);neighbors(S.selected).forEach(n=>s.add(n.o));return s}
  if(S.cluster!=null)return new Set(books.filter(b=>b.c===S.cluster).map(b=>b.id));
  return null;
}
function edgeStyle(i){
  if(!live(i)||!shown().has(i))return"hidden";
  if(S.selEdge===i)return"sel";
  const e=edges[i];
  if(S.selected){if(e.a===S.selected||e.b===S.selected)return"full";return trailEdges().has(i)?"trail":"dim"}
  if(S.cluster!=null)return B[e.a].c===S.cluster&&B[e.b].c===S.cluster?"full":"dim";
  return"full";
}

/* =============== layout (shared, seeded) =============== */
const POS=(()=>{
  let s=7;const rnd=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const cen=CLUSTERS.map((_,i)=>({x:Math.cos(i/5*Math.PI*2-1.2)*95,y:Math.sin(i/5*Math.PI*2-1.2)*80}));
  const p={};books.forEach(b=>p[b.id]={x:cen[b.c].x+(rnd()-.5)*40,y:cen[b.c].y+(rnd()-.5)*40,vx:0,vy:0});
  for(let it=0;it<500;it++){
    const cool=1-it/500;
    books.forEach(a=>books.forEach(b=>{if(a.id>=b.id)return;const A=p[a.id],Bp=p[b.id];let dx=A.x-Bp.x,dy=A.y-Bp.y,d2=dx*dx+dy*dy+.01,d=Math.sqrt(d2);const f=Math.min(900/d2,6);A.vx+=dx/d*f;A.vy+=dy/d*f;Bp.vx-=dx/d*f;Bp.vy-=dy/d*f}));
    edges.forEach(e=>{const A=p[e.a],Bp=p[e.b];let dx=Bp.x-A.x,dy=Bp.y-A.y,d=Math.sqrt(dx*dx+dy*dy)+.01;const L=e.s==="strong"?26:40,f=(d-L)*.03;A.vx+=dx/d*f;A.vy+=dy/d*f;Bp.vx-=dx/d*f;Bp.vy-=dy/d*f});
    books.forEach(b=>{const P=p[b.id],c=cen[b.c];P.vx+=(c.x-P.x)*.012;P.vy+=(c.y-P.y)*.012;P.x+=P.vx*.5*cool;P.y+=P.vy*.5*cool;P.vx*=.6;P.vy*=.6});
  }
  const o={};books.forEach(b=>o[b.id]={x:p[b.id].x,y:p[b.id].y});return o;
})();

/* =============== shared markup =============== */
const lineFor=e=>`<i style="height:${e.s==="strong"?4:2}px"></i>`;
const tagHTML=e=>`<span class="tag ${e.type}">${lineFor(e)}${TYPE[e.type].n}</span>`;

/* =============== force-graph helper (B + C) =============== */
function makeFG(el,o){
  const SC=3.4;
  const nodes=books.map(b=>({id:b.id,b,x:POS[b.id].x*SC,y:POS[b.id].y*SC}));
  const links=edges.map(e=>({source:e.a,target:e.b,i:e.i,e}));
  const nbrSet=()=>{if(!S.selected)return null;const s=new Set([S.selected]);neighbors(S.selected).forEach(n=>s.add(n.o));return s};
  const visN=o.nodeFilter||(n=>present(n.id));
  const visL=o.linkFilter||(l=>shown().has(l.i));
  const fg=ForceGraph()(el).width(el.clientWidth).height(el.clientHeight).backgroundColor("rgba(0,0,0,0)")
    .graphData({nodes,links}).nodeId("id").nodeVisibility(n=>present(n.id)&&visN(n)).linkVisibility(l=>live(l.i)&&visL(l))
    .linkColor(l=>{const dim=S.selected&&!(l.e.a===S.selected||l.e.b===S.selected);return dim?"#e2d8c5":TYPE[l.e.type].c})

/* =============== A / D: Canvas (A = Sigma.js, D = force-graph seeded from ForceAtlas2) =============== */
const CDESC=[
 "Novels about people who give a life to duty, restraint or habit, and find out what it cost. Mostly quiet, mostly late.",
 "Fiction and political thought on how institutions, ideology and planning shape the people inside them.",
 "Stoics, existentialists and one survivor, all asking how to carry on when the world will not supply a meaning.",
 "Books about how minds and sciences form beliefs, and why frames make us blind to what does not fit.",
 "Wide-angle accounts of how humans, land and other living things came to be where they are."
];
const ew=e=>e.s==="strong"?4.5:2.5; // edge width (wider than first round)
function fa2Layout(){
  try{
    const g=new graphology.Graph();
    books.forEach((b,i)=>g.addNode(b.id,{x:Math.cos(i*2.4)*Math.sqrt(i+1)*20,y:Math.sin(i*2.4)*Math.sqrt(i+1)*20}));
    edges.forEach(e=>g.addEdge(e.a,e.b,{weight:e.s==="strong"?2:1}));
    const F=graphologyLibrary.layoutForceAtlas2;
    F.assign(g,{iterations:600,settings:{...F.inferSettings(g),gravity:1.2,scalingRatio:14,edgeWeightInfluence:1}});
    let m=0;g.forEachNode((n,a)=>{m=Math.max(m,Math.hypot(a.x,a.y))});
    const o={};g.forEachNode((n,a)=>o[n]={x:a.x/m*130,y:a.y/m*130});return o;
  }catch(err){console.warn("ForceAtlas2 unavailable, falling back to prototype layout",err);return POS}
}

  return{refresh:render,focus:id=>{if(S.trail[S.trail.length-1]!==id)S.trail.push(id);G.center(id,.7)},destroy(){G.destroy()}};
}

/* =============== shell: variant switcher + arrival simulation =============== */
const variants={A:["Canvas · Sigma",mountA],D:["Canvas · force-graph + ForceAtlas2",mountD],B:["Margin pane",mountB],C:["Trail",mountC]},keys=["A","D","B","C"];
const stage=document.getElementById("stage");let cur=null,curKey=null;
function show(k){
  if(cur)cur.destroy();stage.innerHTML="";const el=document.createElement("div");el.className="variant";stage.appendChild(el);
  curKey=k;cur=variants[k][1](el);
  document.getElementById("vl").textContent=`${k} · ${variants[k][0]}`;
  const u=new URL(location.href);u.searchParams.set("variant",k);history.replaceState(null,"",u);
}
const step=d=>show(keys[(keys.indexOf(curKey)+d+keys.length)%keys.length]);
document.getElementById("prev").onclick=()=>step(-1);document.getElementById("next").onclick=()=>step(1);
addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1)});
const finishBtn=document.getElementById("finish");
finishBtn.onclick=()=>{
  if(S.arrived)return;
  S.arrived=true;S.revealed=new Set();S.selected="stoner";S.selEdge=null;S.fresh=true;S.trail=["stoner"];finishBtn.disabled=true;
  show(curKey);cur.focus("stoner");
  edges.filter(e=>e.a==="stoner"||e.b==="stoner").sort((x,y)=>cmp(x.i,y.i)).forEach((e,k)=>timers.push(setTimeout(()=>{S.revealed.add(e.i);cur.refresh()},1100+k*1000)));
};
document.getElementById("reset").onclick=()=>{timers.forEach(clearTimeout);timers=[];Object.assign(S,{cluster:null,selected:null,selEdge:null,arrived:false,fresh:false,revealed:new Set(),trail:[]});finishBtn.disabled=false;show(curKey)};
const start=()=>{const v=new URL(location.href).searchParams.get("variant");show(variants[v]?v:"A");if(new URL(location.href).searchParams.has("arrive"))finishBtn.click();const cl=new URL(location.href).searchParams.get("cl");if(cl)setTimeout(()=>document.querySelector(`.clabel[data-cl="${cl}"]`)?.click(),1200)};
(document.fonts&&document.fonts.load?Promise.race([document.fonts.load("500 13px Newsreader"),new Promise(r=>setTimeout(r,1500))]):Promise.resolve()).then(start);
</script>
